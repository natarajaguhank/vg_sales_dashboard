services:
  # ----------------------------
  # PostgreSQL Database Service
  # ----------------------------
  postgres:
    image: postgres:14  # official Postgres image
    container_name: postgres_db
    restart: always       # restart container automatically if it crashes
    env_file: .env        # load credentials and DB name from .env
    ports:
      - "5432:5432"       # expose DB to localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data  # persist DB across restarts
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql  # create schema & tables
      - ./postgres/load_data.sql:/docker-entrypoint-initdb.d/load_data.sql  # load CSV into table
      - ./data/vgsales.csv:/docker-entrypoint-initdb.d/data/vgsales.csv  # CSV dataset

  # ----------------------------
  # pgAdmin GUI Service
  # ----------------------------
  pgadmin:
    image: dpage/pgadmin4  # official pgAdmin image
    container_name: pgadmin
    restart: always
    env_file: .env          # credentials for pgAdmin login
    ports:
      - "5050:80"            # local browser access: http://localhost:5050
    depends_on:
      - postgres             # ensure Postgres starts first

  # ----------------------------
  # Apache Superset BI Service
  # ----------------------------
  superset:
    image: apache/superset:2.1.0
    container_name: superset
    restart: always
    env_file: .env           # Superset admin credentials and secret key
    ports:
      - "8088:8088"          # local access: http://localhost:8088
    depends_on:
      - postgres             # ensure Superset connects to Postgres
    volumes:
      - superset_home:/app/superset_home  # persist Superset metadata and configs
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py  # custom Superset config
      - ./superset/init.sh:/app/init.sh  # bootstrap script to create admin + initialize DB

# ----------------------------
# Persistent Volumes
# ----------------------------
volumes:
  postgres_data:            # Postgres DB data storage
  superset_home:            # Superset configs and metadata